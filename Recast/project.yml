name: Recast

options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Recast:
    type: application
    platform: macOS
    sources:
      - Recast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recast.app
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_CFBundleDisplayName: Recast
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        CODE_SIGN_ENTITLEMENTS: Recast/Recast.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"

  RecastTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - RecastTests
    dependencies:
      - target: Recast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recast.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Recast.app/Contents/MacOS/Recast"
        BUNDLE_LOADER: "$(TEST_HOST)"
